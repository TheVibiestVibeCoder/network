# CRM MCP server + Caddy (HTTPS and the address filter in front of it).
#
#   docker compose up -d --build     start / update
#   docker compose logs -f           watch what happens
#   docker compose down              stop
#
# Settings come from .env (create it with: python3 scripts/setup.py).

services:
  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - mcp-data:/data
    # Not published: only Caddy (on the internal network below) can reach it.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=160m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - crm-mcp

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      EXTRA_ALLOWED_IPS: ${EXTRA_ALLOWED_IPS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - crm-mcp

volumes:
  mcp-data:
  caddy-data:
  caddy-config:

networks:
  crm-mcp:
