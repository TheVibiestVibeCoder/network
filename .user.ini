; PHP limits for invoice (PDF) uploads.
; PHP's defaults are upload_max_filesize=2M / post_max_size=8M, which silently
; reject ordinary multi-page or scanned invoices. These values are read by the
; PHP-FPM / CGI SAPI used by most hosts. For mod_php, see .htaccess instead.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 40
