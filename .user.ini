; ---------------------------------------------------------------------------
; PHP settings for the PHP-FPM / CGI SAPI used by most hosts.
; For mod_php, the equivalents live in .htaccess.
; ---------------------------------------------------------------------------

; --- Upload limits ---------------------------------------------------------
; PHP's defaults are upload_max_filesize=2M / post_max_size=8M, which silently
; reject ordinary multi-page or scanned invoices.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 40

; --- Never render errors into the response ---------------------------------
; A notice or warning in the output leaks absolute paths, SQL fragments and
; occasionally secrets. Log everything, display nothing.
display_errors = Off
display_startup_errors = Off
log_errors = On

; --- Session hardening -----------------------------------------------------
; The application sets these from PHP as well; having them here means they
; also apply to any request that starts a session before that code runs.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Strict

; NOTE: allow_url_fopen must stay enabled - the Nominatim geocoding lookup in
; api/contacts.php uses file_get_contents() against an https URL.
